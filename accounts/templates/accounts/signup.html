{% extends "base.html" %}
{% load socialaccount %}


{% block title %}
Signup | Hotel Booking
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>


                    <!-- Normal Signup -->

                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Create Account
                        </button>

                    </form>


                    <!-- Divider -->

                    <div class="text-center my-4">

                        <span class="text-muted">
                            OR
                        </span>

                    </div>


                    <!-- Google Signup/Login -->

                    <form
    method="POST"
    action="{% provider_login_url 'google' %}"
>

    {% csrf_token %}

    <button
        type="submit"
        class="btn btn-outline-danger w-100"
    >
        Continue with Google
    </button>

</form>


                    <p class="text-center mt-3 mb-0">

                        Already have an account?

                        <a href="{% url 'login' %}">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
